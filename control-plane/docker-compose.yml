services:
  api:
    image: python:3.12-slim
    container_name: remoteview-api
    working_dir: /app
    volumes:
      - ./api:/app
    command: python -m http.server 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: remoteview-db
    environment:
      POSTGRES_DB: remoteview
      POSTGRES_USER: remoteview
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
