services:
  api:
    build: ./api
    container_name: remoteview-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://remoteview:change-me@db:5432/remoteview
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: remoteview-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: remoteview
      POSTGRES_USER: remoteview
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteview -d remoteview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
